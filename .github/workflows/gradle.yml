name: Build

on:
    push:
        branches: [ "4.0" ]
    pull_request:
        branches: [ "4.0" ]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                version: [ '26.1', '26.2', '26.3', '26.4' ]
        steps:
            - uses: actions/checkout@v5
            - name: Setup JDK 25
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '25'
            - name: Setup gradle
              uses: gradle/actions/setup-gradle@v5
            - run: chmod +x gradlew
            - name: Build
              run: ./gradlew build
            -   name: Upload Artifact ${{ matrix.version }}
              uses: actions/upload-artifact@v4.0.0
              with:
                  name: ${{ matrix.version }}
                  path: build/libs/*-${{ matrix.version }}.jar
