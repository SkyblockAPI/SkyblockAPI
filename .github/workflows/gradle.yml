name: Build

on:
    push:
        branches: [ "4.0" ]
    pull_request:
        branches: [ "4.0" ]

permissions:
    contents: read
jobs:
    build-matrix:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                version: [ '26.1', '26.2', '26.3' ]
        steps:
            -   uses: actions/checkout@v5
            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: '25'
            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5
            -   run: chmod +x gradlew
            -   name: Build
                run: ./gradlew :${{ matrix.version }}:build
            -   name: Upload Artifact
                uses: actions/upload-artifact@v4.0.0
                with:
                    name: ${{ matrix.version }}
                    path: build/libs/*-${{ matrix.version }}.jar

    build:
        runs-on: ubuntu-latest
        needs: build-matrix
        if: always()
        steps:
            -   name: Check matrix result
                if: ${{ needs.build.result != 'success' }}
                run: exit 1