name: API Baseline Updater

on:
    push:
        branches: [ "4.0" ]

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: breaking-changes-baseline-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    baseline-updater:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5
                with:
                    token: ${{ secrets.BOT_TOKEN }}

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: '25'

            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5

            -   run: chmod +x gradlew

            -   name: Build
                run: ./gradlew build

            -   name: Update Legacy ABI
                run: ./gradlew updateLegacyAbi

            -   name: Check and Push Updates
                env:
                    GH_TOKEN: ${{ secrets.BOT_TOKEN }}
                run: |
                    if ! git diff --exit-code versions/26.1/api/26.1.api || ! git diff --exit-code versions/26.2/api/26.2.api || ! git diff --exit-code versions/26.3/api/26.3.api;
                    then
                        git config --global user.email "meowtomation@users.noreply.github.com"
                        git config --global user.name "meowtomation"
                        git add versions/26.1/api/26.1.api versions/26.2/api/26.2.api versions/26.3/api/26.3.api
                        git commit -m "update api dump"
                        git push origin HEAD:${{ github.ref_name }}
                    fi
