name: Breaking Changes Baseline

on:
    push:
        branches: [ "4.0" ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: breaking-changes-baseline-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    baseline-updater:
        if: github.repository_owner == 'SkyblockAPI' && github.ref == 'refs/heads/4.0'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        steps:
            # Credentials aren't persisted: the build runs Gradle plugins and dependencies that could read them.
            -   uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: 'temurin'
                    java-version: '25'

            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5

            -   run: chmod +x gradlew

            -   name: Build
                run: ./gradlew build

            -   name: Update Legacy ABI
                run: ./gradlew updateLegacyAbi

            # The bot token only exists in this step.
            -   name: Commit and push updated dumps
                env:
                    BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
                    BRANCH: ${{ github.ref_name }}
                run: |
                    DUMPS='versions/*/api/*.api'

                    if [ -z "$(git status --porcelain -- "$DUMPS")" ]; then
                        echo "API dumps are up to date."
                        exit 0
                    fi

                    git config user.email "meowtomation@users.noreply.github.com"
                    git config user.name "meowtomation"
                    git add -- "$DUMPS"
                    git commit -m "update api dump"

                    # Auth via environment so the token never lands in .git/config or argv. The base64 form is
                    # not auto-masked by GitHub, so mask it explicitly.
                    AUTH=$(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w0)
                    echo "::add-mask::$AUTH"
                    GIT_CONFIG_COUNT=1 \
                    GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
                    GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
                    git push origin "HEAD:refs/heads/$BRANCH"
