name: Breaking Changes Checker

on:
    pull_request:
        branches: [ "4.0" ]
        types: [ opened, reopened, synchronize, ready_for_review, converted_to_draft ]

permissions:
    contents: read

# Workflow level on purpose: converting a PR to a draft has to cancel a running check.
concurrency:
    group: breaking-changes-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    breaking-change-check:
        if: >-
            github.event.pull_request.state == 'open'
            && !github.event.pull_request.draft
            && !contains(github.event.pull_request.labels.*.name, 'Ignore Breaking')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            -   uses: actions/checkout@v5
                with:
                    repository: ${{ github.event.pull_request.head.repo.full_name }}
                    ref: ${{ github.event.pull_request.head.sha }}
                    persist-credentials: false

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: 'temurin'
                    java-version: '25'

            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5

            -   run: chmod +x gradlew

            -   name: Backup current versions
                run: find versions -name "*.api" -exec sh -c 'cp "$1" "$1.old"' _ '{}' \;

            -   name: Update API baseline
                run: ./gradlew updateKotlinAbi

            -   name: Generate API Diffs
                run: ./.github/scripts/compare_dumps.main.kts >> api.removed

            -   name: Check for breaking changes
                run: |
                    if grep -q '[^[:space:]]' < api.removed
                    then
                        cat api.removed
                        exit 1
                    fi

            -   name: Upload breaking-change report
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: breaking-change-report-${{ github.run_attempt }}
                    path: api.removed
                    if-no-files-found: ignore

    # When this check is skipped the run concludes "skipped", which the commenter ignores, so an old comment and
    # label would stay forever. One successful job makes the run conclude "success" and the commenter cleans up.
    draft-cleanup:
        if: >-
            github.event.action == 'converted_to_draft'
            || contains(github.event.pull_request.labels.*.name, 'Ignore Breaking')
        runs-on: ubuntu-latest
        steps:
            -   run: echo "Check skipped, finishing as success so the commenter clears the PR state."
