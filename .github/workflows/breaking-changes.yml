name: Breaking Changes Checker

on:
    pull_request:
        branches: [ "1.x" ]

permissions:
    contents: write
    pull-requests: write

jobs:
    build:

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4.0.0
              with:
                  java-version: '21'
                  distribution: 'temurin'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v3

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Build with Gradle
              run: ./gradlew apiDump || true

            -   name: Compare API
                run: git diff api/SkyblockAPI.api | grep "^-[^-]" >> api.removed || true

            -   name: Check for breaking changes
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if grep -q '[^[:space:]]' < api.removed
                    then
                        echo "Breaking changes detected, please make sure not to break APIs between MC versions." >> comment
                        echo "Please check the following diff:" >> comment
                        echo "\`\`\`diff" >> comment
                        cat api.removed >> comment
                        echo "\`\`\`" >> comment
                        gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file comment
                    fi
