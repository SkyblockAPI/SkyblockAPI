name: Breaking Changes Checker

on:
    pull_request_target:
        branches: [ "4.0" ]

permissions:
    contents: read
    pull-requests: write

# should hopefully cancel current actions when a newer one happens
concurrency:
    group: breaking-changes-${{ github.event.pull_request.id }}
    cancel-in-progress: true


jobs:
    breaking-change-check:

        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5
                with:
                    allow-unsafe-pr-checkout: 'true' # we won't execute any code if any *.gradle file was changes
                    ref: ${{ github.event.pull_request.head.sha }}

            -   name: Fail if build files are changed
                if: ${{ github.event.pull_request.head.repo.owner.name != 'SkyblockAPI' && github.event.pull_request.head.repo.owner.name != 'j10a1n15' }}
                run: |
                    if git diff --name-only ${{ github.event.pull_request.head.sha }} ${{ github.event.pull_request.base.sha }} | grep -E ".*gradle.*|buildSrc/,*"; then
                        echo "Unable to check for breaking changes!" >> comment
                        echo "Build file modifications have been detected, please revert them to run checks!" >> comment
                        gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file comment
                        exit 1
                    fi

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    java-version: '25'
                    distribution: 'temurin'

            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5
            -   run: chmod +x gradlew

            -   name: Update API baseline
                run: ./gradlew updateKotlinAbi || true

            -   name: Generate API Diffs
                run: ./.github/scripts/compare_dumps.main.kts >> api.removed

            -   name: Check for breaking changes
                env:
                    GH_TOKEN: ${{ secrets.COMMENT_TOKEN }}
                run: |
                    if grep -q '[^[:space:]]' < api.removed
                    then
                        echo "Breaking changes detected, please make sure not to break APIs between MC versions." >> comment
                        echo "Please check the following diff:" >> comment
                        echo "\`\`\`diff" >> comment
                        cat api.removed >> comment
                        echo "\`\`\`" >> comment
                        gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file comment
                        gh pr edit ${{ github.event.number }} --repo ${{ github.repository }} --add-label "breaking change"
                        exit 1
                    else
                        gh pr edit ${{ github.event.number }} --repo ${{ github.repository }} --remove-label "breaking change"
                    fi
