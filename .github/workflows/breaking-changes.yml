name: Breaking Changes Checker

on:
    pull_request_target:
        branches: [ "4.0" ]

permissions:
    contents: read
    pull-requests: write

# should hopefully cancel current actions when a newer one happens
concurrency:
    group: breaking-changes-${{ github.event.pull_request.id }}
    cancel-in-progress: true


jobs:
    breaking-change-check:
        if: ${{ !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'Ignore Breaking') }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5
                with:
                    allow-unsafe-pr-checkout: 'true' # we won't execute any code if any *.gradle file was changes
                    ref: ${{ github.event.pull_request.head.sha }}

            -   name: Fail if build files are changed
                if: ${{ github.event.pull_request.head.repo.owner.login != 'SkyblockAPI' && github.event.pull_request.head.repo.owner.login != 'j10a1n15' && !contains(github.event.pull_request.labels.*.name, 'Trusted Gradle Changes') }}
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    git fetch origin ${{ github.event.pull_request.base.sha }}
                    if git diff --name-only ${{ github.event.pull_request.head.sha }} ${{ github.event.pull_request.base.sha }} | grep -E ".*gradle.*|buildSrc/.*|.*main.kts"; then
                        echo "Unable to check for breaking changes!" >> comment
                        echo "Build file modifications have been detected, please revert them to run checks!" >> comment
                        gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file comment
                        exit 1
                    fi

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    java-version: '25'
                    distribution: 'temurin'

            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5
            -   run: chmod +x gradlew

            -   name: Backup current versions
                run: find versions -name *.api -exec sh -c 'cp $1 $1.old' _ '{}' \;

            -   name: Update API baseline
                run: ./gradlew updateKotlinAbi || true

            -   name: Generate API Diffs
                run: ./.github/scripts/compare_dumps.main.kts >> api.removed

            -   name: Upload breaking changes
                uses: actions/upload-artifact@v4.0.0
                with:
                    name: api.removed
                    path: api.removed
