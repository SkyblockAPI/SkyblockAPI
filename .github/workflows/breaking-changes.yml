name: Breaking Changes Checker

on:
    pull_request:
        branches: [ "4.0" ]
        types: [ opened, synchronize, ready_for_review, converted_to_draft ]

permissions:
    contents: read

concurrency:
    group: breaking-changes-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    breaking-change-check:
        if: >-
            github.event.pull_request.state == 'open'
            && !github.event.pull_request.draft
            && !contains(github.event.pull_request.labels.*.name, 'Ignore Breaking')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5
                with:
                    repository: ${{ github.event.pull_request.head.repo.full_name }}
                    ref: ${{ github.event.pull_request.head.sha }}
                    persist-credentials: false

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    java-version: '25'
                    distribution: 'temurin'

            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5

            -   run: chmod +x gradlew

            -   name: Backup current versions
                run: find versions -name "*.api" -exec sh -c 'cp "$1" "$1.old"' _ '{}' \;

            -   name: Update API baseline
                run: ./gradlew updateKotlinAbi || true

            -   name: Generate API Diffs
                run: ./.github/scripts/compare_dumps.main.kts >> api.removed

            -   name: Check for breaking changes
                run: |
                    if grep -q '[^[:space:]]' < api.removed
                    then
                        echo "Breaking changes detected, please make sure not to break APIs between MC versions." >> comment
                        echo "Please check the following diff:" >> comment
                        echo "\`\`\`diff" >> comment
                        cat api.removed >> comment
                        echo "\`\`\`" >> comment
                        exit 1
                    fi

            -   name: Upload breaking-change report
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: breaking-change-report
                    path: comment
                    if-no-files-found: ignore

    state-cleanup:
        if: >-
            github.event.action == 'converted_to_draft'
            || contains(github.event.pull_request.labels.*.name, 'Ignore Breaking')
        runs-on: ubuntu-latest
        steps:
            -   run: echo "Breaking-change check is not applicable; the commenter workflow will clear its state."

    save-pr:
        needs: breaking-change-check
        if: ${{ failure() && github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        steps:
            -   name: Save pull request number
                run: echo "$PR_NUMBER" > "$RUNNER_TEMP/pr-number"
                env:
                    PR_NUMBER: ${{ github.event.pull_request.number }}
            -   name: Upload pull request number
                uses: actions/upload-artifact@v4
                with:
                    name: breaking-change-pr-number
                    path: ${{ runner.temp }}/pr-number
