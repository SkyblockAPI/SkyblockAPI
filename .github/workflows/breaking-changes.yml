name: Breaking Changes Checker

on:
    pull_request_target:
        branches: [ "4.0" ]

permissions:
    contents: read
    pull-requests: write

jobs:
    breaking-change-check:

        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v5

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    java-version: '25'
                    distribution: 'temurin'

            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5
            -   run: chmod +x gradlew

            -   name: Update API baseline
                run: ./gradlew updateLegacyAbi || true

            -   name: Generate API Diffs
                run: |
                    git diff versions/26.1/api/26.2.api | grep "^-[^-]" >> api.removed || true
                    git diff versions/26.1/api/26.1.api | grep "^-[^-]" >> api.removed || true

            -   name: Check for breaking changes
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if grep -q '[^[:space:]]' < api.removed
                    then
                        echo "Breaking changes detected, please make sure not to break APIs between MC versions." >> comment
                        echo "Please check the following diff:" >> comment
                        echo "\`\`\`diff" >> comment
                        cat api.removed >> comment
                        echo "\`\`\`" >> comment
                        gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file comment
                        exit 1
                    fi
