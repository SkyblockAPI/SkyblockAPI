name: Breaking Changes Checker

on:
    pull_request_target:
        branches: [ "2.0" ]

permissions:
    contents: write
    pull-requests: write

jobs:
    breaking-change-check:

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - name: Setup JDK 21
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Setup gradle
              uses: gradle/actions/setup-gradle@v5

            - run: chmod +x gradlew
            - name: Build
              run: ./gradlew build

            - name: Build with Gradle
              run: ./gradlew apiDump || true

            -   name: Compare API
                run: git diff | grep "^-[^-]" >> api.removed || true

            -   name: Check for breaking changes
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if grep -q '[^[:space:]]' < api.removed
                    then
                        echo "Breaking changes detected, please make sure not to break APIs between MC versions." >> comment
                        echo "Please check the following diff:" >> comment
                        echo "\`\`\`diff" >> comment
                        cat api.removed >> comment
                        echo "\`\`\`" >> comment
                        gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file comment
                        exit 1
                    else
                        exit -1
                    fi
